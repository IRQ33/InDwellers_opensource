buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.postgresql:postgresql:42.7.3"
        classpath "org.flywaydb:flyway-database-postgresql:12.4.0"
    }
}


plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
    id "org.flywaydb.flyway" version "12.4.0"
    id 'io.github.goooler.shadow' version '8.1.8'
}

group = 'com.irq3'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

jar{
    manifest {
        attributes(
                'Main-Class': 'com.irq3.InDwellersKt'
        )
    }
}

shadowJar {
    archiveBaseName.set("app")
    archiveClassifier.set("")
    archiveVersion.set("")

    mergeServiceFiles()
}

var ktorVersion = "3.4.2"

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation("com.zaxxer:HikariCP:7.0.2")
    implementation("org.postgresql:postgresql:42.7.3")
    implementation("net.dv8tion:JDA:6.5.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3")
    implementation("org.flywaydb:flyway-database-postgresql:12.4.0")
    implementation("org.flywaydb:flyway-core:12.4.0")
    implementation("org.jetbrains.exposed:exposed-core:0.61.0")
    implementation("org.jetbrains.exposed:exposed-jdbc:0.61.0")
    implementation("org.jetbrains.exposed:exposed-dao:0.61.0")
    implementation("org.jetbrains.exposed:exposed-kotlin-datetime:0.61.0")
    implementation("ch.qos.logback:logback-classic:1.5.32")
    implementation("net.logstash.logback:logstash-logback-encoder:9.0")
    implementation("io.ktor:ktor-client-core-jvm:$ktorVersion")
    runtimeOnly("io.ktor:ktor-client-okhttp-jvm:$ktorVersion")
    implementation("io.ktor:ktor-server-core-jvm:$ktorVersion")
    implementation("io.ktor:ktor-server-netty:$ktorVersion")
    implementation("io.ktor:ktor-serialization-gson:$ktorVersion")
    implementation("io.ktor:ktor-server-content-negotiation:$ktorVersion")
    implementation("org.mockito:mockito-core:5.4.0")
    implementation("org.mockito.kotlin:mockito-kotlin:6.3.0")
    implementation("org.bouncycastle:bcprov-jdk18on:1.78")
}

test {
    useJUnitPlatform()
}
kotlin {
    jvmToolchain(25)
}
def loadEnv() {
    def env = [:]
    def envFile = file(".env")

    if (!envFile.exists()) {
        return env
    }

    envFile.eachLine { line ->
        line = line.trim()

        if (!line || line.startsWith("#")) {
            return
        }

        def parts = line.split("=", 2)
        if (parts.length == 2) {
            env[parts[0].trim()] = parts[1].trim()
        }
    }

    return env
}

def env = loadEnv()

flyway {
    url = System.getenv("DB_URL") ?: env["DB_URL"] ?: "jdbc:postgresql://localhost:5433/inDwellers"
    user = System.getenv("DB_USER") ?: env["DB_USER"] ?: "root"
    password = System.getenv("DB_PASSWORD") ?: env["DB_PASSWORD"] ?: "password"
}